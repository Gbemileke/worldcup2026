name: Auto-Update Match Data

on:
  schedule:
    # ── RESULT-DRIVEN POLLING ─────────────────────────────────────
    # Instead of hand-computed per-match crons (which required getting each
    # kickoff's timezone offset right and guessing when extra-time/penalty
    # matches finish), we poll frequently and let the pipeline self-gate:
    #   • update_match_stats.py only records matches ESPN marks completed
    #     (status.state == 'post'), so an in-progress match is never written.
    #   • the commit step pushes ONLY when data actually changed
    #     (git diff --staged --quiet), so polls with no new result are no-ops.
    # Net effect: the site updates shortly after each match concludes on ESPN,
    # with no timezone math and no feed-lag gamble. A finished extra-time /
    # penalty match is picked up on the next poll once ESPN posts the result.
    #
    # Every 30 min during tournament active hours (kickoffs span ~16:00–04:00
    # UTC; polling 17:00–05:00 UTC covers every match plus post-match settle).
    - cron: '*/30 17-23 * 6,7 *'
    - cron: '*/30 0-5 * 6,7 *'
    # Low-frequency safety net the rest of the day (also covers any edge cases).
    - cron: '0 */6 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Step 1 — Scrape ESPN (goals, stats, knockout scores)
        env:
          ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python update_match_stats.py

      - name: Step 2 — Auto-populate knockout results from scrape
        run: python update_wc.py --section auto-knockout

      - name: Step 3 — Validate data integrity + auto-fix
        run: python update_wc.py --section validate

      - name: Step 4 — Sync goals to index.html
        run: python update_wc.py --section goals

      - name: Step 5 — Sync match stats to index.html
        run: python update_wc.py --section stats

      - name: Step 6 — Re-apply knockout results (manual entries preserved)
        run: python update_wc.py --section knockout

      - name: Step 7 — Refresh FIFA ranking from recorded results
        # FIFA points are the only ranking derived from match results, so they
        # must refresh the moment a result is recorded. This runs the FIFA-only
        # updater (update_fifa.py) — it recomputes fifaPts / deltas / rank-deltas
        # via the SUM formula and patches just those fields. Elo and Polymarket
        # odds are external, daily data and are left to daily-rankings.yml.
        # update_fifa.py is idempotent (rebuilds from the frozen Jun-11 baseline
        # every run) so running it each cycle never double-counts. Non-fatal:
        # a failure here won't block the match-data update from pushing.
        run: python update_fifa.py || echo "FIFA refresh skipped (non-fatal)"

      - name: Step 8 — Update upcoming fixtures
        run: python update_wc.py --section upcoming

      - name: Step 9 — Recompute team form
        run: python update_wc.py --section form

      - name: Step 10 — Update snapshot cards
        run: python update_wc.py --section snapshot

      - name: Step 11 — Build stamp
        run: python update_wc.py --section stamp

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git diff --staged --quiet \
            && echo "No changes" \
            || (git commit -m "auto: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
